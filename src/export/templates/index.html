<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Single-player policy, release plan section 3.6. The game loads only its own files. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; media-src 'self' data: blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="gcs:manifest" content="{{MANIFEST_PATH}}" />
    <title>{{TITLE}}</title>
    <style>
      html, body, #game { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0b10; }
      noscript p { color: #d4d4d4; font: 16px system-ui, sans-serif; padding: 24px; }
    </style>
    <script type="module" src="{{RUNTIME_PATH}}"></script>
  </head>
  <body>
    <div id="game"></div>
    <noscript><p>This game needs JavaScript. Turn it on for this page and reload.</p></noscript>
  </body>
</html>
