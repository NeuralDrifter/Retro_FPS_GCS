name: CI

on:
  push:
  pull_request:
  schedule:
    # Nightly: also runs the e2e specs in Firefox and WebKit
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      all_browsers:
        description: Also run the e2e specs in Firefox and WebKit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build for GitHub Pages
        run: npm run build:pages

      - name: Install Chromium for e2e
        run: npx playwright install --with-deps chromium
      - name: E2E smoke (Chromium)
        run: npx playwright test

      - name: Upload the tested build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
      - name: Upload e2e reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  e2e-all-browsers:
    name: E2E in Firefox and WebKit
    if: github.event_name == 'schedule' || inputs.all_browsers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_ALL_BROWSERS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:pages
      - run: npx playwright install --with-deps firefox webkit
      - run: xvfb-run --auto-servernum npx playwright test --project=firefox --project=webkit
        env:
          E2E_FIREFOX_HEADED: '1'
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-all-browsers
          path: |
            playwright-report/
            test-results/
          retention-days: 14
